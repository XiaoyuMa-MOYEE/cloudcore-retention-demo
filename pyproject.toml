[project]
name = "cloudcore-retention-demo"
version = "0.3.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
local = ["openai>=1.66.0,<3.0", "python-dotenv>=1.0,<2.0", "uvicorn[standard]>=0.34,<1.0"]

[dependency-groups]
dev = [
  "workers-py",
  "workers-runtime-sdk",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend", "src"]
