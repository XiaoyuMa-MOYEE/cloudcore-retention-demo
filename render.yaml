services:
  - type: web
    name: cloudcore-retention-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    disk:
      name: cloudcore-runtime
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: GROUP_ACCESS_CODE
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: PUBLIC_ORIGIN
        value: https://cloudcore.moyee.uk
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOW_UPLOADED_SYNTHETIC_ANALYSIS
        value: "false"
